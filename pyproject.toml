[project]
name = "eu-power-market-data"
version = "0.1.0"
description = "European power market data platform: ENTSO-E ingestion, data quality, battery arbitrage atlas and day-ahead price forecasting."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kirankumar Ashok Patil" }]
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.scripts]
eupm = "eupm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eupm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
